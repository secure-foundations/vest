[package]
name = "vest_asn1"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Generate formally verified, efficient parsers and serializers from ASN.1 schemas"
repository.workspace = true
documentation = "https://secure-foundations.github.io/vest/guide/asn1/"
readme = "README.md"
keywords = ["asn1", "verus", "verification", "parser", "serializer"]
categories = ["command-line-utilities", "development-tools", "parsing"]

[dependencies]
clap = { version = "4.4.7", features = ["derive"] }

[package.metadata.vest]
vest_lib = "=0.2.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)", "cfg(verus_keep_ghost)"] }
