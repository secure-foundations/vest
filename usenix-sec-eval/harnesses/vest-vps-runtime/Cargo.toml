[package]
name = "vest-vps-runtime-eval"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vest_lib = { path = "../../../vest" }
vest_lib2 = { path = "../../../vest_lib2" }
vest_tls = { package = "tls", path = "../../../vest-dsl/tls" }
vest_bitcoin = { package = "vestbitcoin", path = "../../../vest-dsl/bitcoin" }
vps_generated = { package = "test", path = "../../../vest2/test" }
base64 = "0.22.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vest_vps"
harness = false

[profile.bench]
lto = "fat"
opt-level = 3
codegen-units = 1

