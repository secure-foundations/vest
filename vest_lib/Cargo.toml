[package]
name = "vest_lib"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Verified parser and serializer combinators for Verus"
repository.workspace = true
readme = "README.md"
keywords = ["verus", "verification", "parser", "serializer", "combinators"]
categories = ["parsing", "no-std"]

[features]
default = ["std"]
std = ["alloc", "vstd/std"]
alloc = ["vstd/alloc"]

[dependencies]
vstd.workspace = true

[package.metadata.verus]
verify = true

[package.metadata.verus.ide]
extra_args = "--expand-errors"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)", 'cfg(verus_keep_ghost)'] }
