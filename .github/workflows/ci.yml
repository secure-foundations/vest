name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-
      - name: Formatting
        run: cargo fmt -p vest -p vest_asn1 -- --check
      - name: Clippy
        run: cargo clippy -p vest -p vest_asn1 --all-targets
      - name: Workspace tests
        run: cargo test --workspace
      - name: vest_lib core-only check
        run: cargo check -p vest_lib --no-default-features --all-targets
      - name: vest_lib alloc-only check
        run: cargo check -p vest_lib --no-default-features --features alloc --all-targets
      - name: Compile benchmarks with the workspace profile
        run: |
          output="$(cargo bench --no-run -p vest_tests -p vest_dev 2>&1)"
          echo "$output"
          ! grep -qi "profile.*non root package.*ignored" <<<"$output"

  regeneration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/verusfmt
            target
          key: linux-regen-${{ hashFiles('Cargo.lock') }}-verusfmt-0.7.2
          restore-keys: linux-regen-
      - name: Install verusfmt
        run: command -v verusfmt >/dev/null || cargo install verusfmt --version 0.7.2 --locked
      - name: Regenerate Vest fixtures
        working-directory: vest_tests
        run: make vest
      - name: Regenerate ASN.1 fixtures
        working-directory: vest_asn1_tests
        run: make generate
      - name: Generated files are current
        run: git diff --exit-code

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vest_lib-core
            cargo_args: -p vest_lib --no-default-features
          - name: vest_lib-alloc
            cargo_args: -p vest_lib --no-default-features --features alloc
          - name: vest_lib-std
            cargo_args: -p vest_lib
          - name: vest-tests
            cargo_args: -p vest_tests
          - name: vest-asn1-tests
            cargo_args: -p vest_asn1_tests
          - name: vest-dev
            cargo_args: -p vest_dev
    name: Verify ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .verus
          key: verus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verus-version.txt') }}
      - name: Install pinned Verus and Rust toolchain
        run: scripts/install-verus.sh
      - name: Add Verus to PATH
        run: echo "${{ github.workspace }}/.verus" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-verus-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'verus-version.txt') }}
          restore-keys: |
            linux-verus-${{ matrix.name }}-
            linux-verus-
      - run: cargo verus verify ${{ matrix.cargo_args }} -- --expand-errors

  verify-macos:
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .verus
          key: verus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verus-version.txt') }}
      - name: Install pinned Verus and Rust toolchain
        run: scripts/install-verus.sh
      - name: Add Verus to PATH
        run: echo "${{ github.workspace }}/.verus" >> "$GITHUB_PATH"
      - run: cargo verus verify -p vest_lib -- --expand-errors
      - run: cargo verus verify -p vest_tests -- --expand-errors
      - run: cargo verus verify -p vest_asn1_tests -- --expand-errors
      - run: cargo verus verify -p vest_dev -- --expand-errors
