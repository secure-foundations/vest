[package]
name = "vest_asn1_tests"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
# CI verifies these groups separately to bound memory use. Normal builds and
# runtime tests still include every generated module.
default = ["fixtures", "cms", "stress"]
fixtures = []
cms = []
stress = []

[dependencies]
vstd = { workspace = true, features = ["std"] }
vest_lib = { workspace = true, features = ["std"] }

[dev-dependencies]
vest_asn1 = { path = "../vest_asn1" }

[package.metadata.verus]
verify = true

[package.metadata.verus.ide]
extra_args = "--expand-errors"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)", "cfg(verus_keep_ghost)"] }
